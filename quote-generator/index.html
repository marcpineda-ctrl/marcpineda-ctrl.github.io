<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f9f9f9;
      padding: 2rem;
    }

    h1 {
      color: #333;
      margin-bottom: 2rem;
    }

    .quote-box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    #quote {
      font-size: 1.25rem;
      color: #333;
      line-height: 1.6;
      margin-bottom: 1rem;
      font-style: italic;
    }

    #author {
      font-size: 1rem;
      color: #0070f3;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      background: #0070f3;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #005bb5;
    }

    a {
      margin-top: 2rem;
      color: #0070f3;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Random Quote Generator</h1>

  <div class="quote-box">
    <p id="quote">"Click the button to get a quote!"</p>
    <p id="author">— Unknown</p>
    <button id="newQuote">New Quote</button>
  </div>

  <a href="../index.html">← Back to Portfolio</a>

  <script src="script.js"></script>
</body>
</html>
